name: Build raspberry-pi_3b imwrt 25.12-snapshot kernel 6.18 actions.

on:
  workflow_dispatch:
    inputs:

      restore_config:
        description: 'RESTORE_BAKCONF. 🇯🇵 環境設定復元'
        type: boolean
        default: false
      #boost_wifi_5g:
      #  description: 'BOOST_WIFI5G_SG. 🇯🇵 ５Ｇ信号増幅'
      #  type: boolean
      #  default: false
      upload_firmware:
        description: 'UPLOAD_ARTIFACT. 🇯🇵 成果物の保存'
        type: boolean
        default: false
      upload_release:
        description: 'UPLOAD_RELEASES. 🇯🇵 リリース公開'
        type: boolean
        default: false
      upload_cloud:
        description: 'UPLOAD_TO_CLOUD. 🇯🇵 クラウド保存'
        type: boolean
        default: false  
      #upload_wenshushu:
      #  description: 'UPLOAD_TO_WENSS. 🇯🇵 文叔叔へ転送'
      #  type: boolean
      #  default: false
      telegram_notify:
        description: 'TELEGRAM_NOTIFY. 🇯🇵 ＴＧ通知送信'
        type: boolean
        default: true

env:
  ## hardware & repo info
  TARGET_MODEL:         raspberry-pi_3b
  TARGET_CHIPS:         bcm2710
  TARGET_MEDIA:         2g_tf
  OUTPUT_FILES:         diamondwrt-25.12-ss-raspberry-pi_3b-2gb_tf
  TZ:                   "Asia/Tokyo"
  ## github token
  GITHUB_TOKEN:         ${{ secrets.ACCESS_GITHUB_TOKEN }}
  ACCESS_TOKEN:         ${{ secrets.ACCESS_GITHUB_TOKEN }}
  RUN_WORKFLOW:         ${{ github.workflow }}
  RUN_REF_NAME:         ${{ github.ref_name }}
  RUN_REF_REPO:         ${{ github.repository }}
  RUNID_NUMBER:         ${{ github.run_id }}
  PRIVATE_DATA:         ${{ secrets.PRI_ANNAWRT_DATCORE }}
  FIRMWARE_SHA:         ${{ secrets.PRI_FIRMWARE_SHA512 }}
  ## immortalwrt source
  GIT_REPO_URL:         ${{ secrets.RP_IMMORTALWRT_LINK }}
  ## immortalwrt 25.12
  GIT_HEAD_REF:         master
  PLUGINS_REPO:         ${{ github.workspace }}/${{ secrets.RP_PLUGINGIN_AN2512 }}
  PATCHIN_REPO:         ${{ github.workspace }}/${{ secrets.RP_PATCHWORK_IM2512 }}
  ADDING_FEEDS:         ${{ github.workspace }}/${{ secrets.RP_IMPORTING_IM2512 }}
  ## github ci scripts
  CHECK_SERVER:         ${{ github.workspace }}/${{ secrets.CI_TEST_SERVER_PERF }}
  EXPAND_SPACE:         ${{ github.workspace }}/${{ secrets.CI_FREE_DISKS_SPACE }}
  INIT_ENV_VAR:         ${{ github.workspace }}/${{ secrets.CI_INIT_ENVIRONMENT }}
  REMOV_CN_SRC:         ${{ github.workspace }}/${{ secrets.CI_REMOVE_CN_SOURCE }}
  GET_KER_VERS:         ${{ github.workspace }}/${{ secrets.CI_GET_KER_PATCHVER }}
  UPDATE_LANGS:         ${{ github.workspace }}/${{ secrets.CI_UP_PACKAGES_LANG }}
  FIRMWARE_ORG:         ${{ github.workspace }}/${{ secrets.CI_ORGANIZE_FW_FILE }}
  CALC_RUNTIME:         ${{ github.workspace }}/${{ secrets.CI_CALC_RUNING_TIME }}
  ## device configure
  PRIVATEPATCH:         ${{ github.workspace }}/${{ secrets.CI_SET_PRIVATE_PATH }}
  DEVICE_PATCH:         ${{ secrets.DEV_RP3B_IMM_PATCHS }}
  BUILD_CONFIG:         ${{ secrets.DEV_RP3B_IMM_CONFIG }}
  BACKUP_FILES:         ${{ secrets.DEV_RP3B_IMM_BACKUP }}
  ARGON_COLORS:         ${{ secrets.DEV_THEMESTYL_ARGON }}
  NEW_HW_SUPOT:         ${{ github.workspace }}/${{ secrets.DEV_HARDWARE_SUPPOT }}
  ## upload firmware
  UP_CLOUDSTOR:         ${{ github.workspace }}/${{ secrets.CI_UPLOAD_CLOUDSTOR }}
  UP_GHRELEASE:         ${{ github.workspace }}/${{ secrets.CI_UPLOAD_GHRELEASE }}
  UP_WENSHUSHU:         ${{ github.workspace }}/${{ secrets.CI_UPLOAD_WENSHUSHU }}
  ## cache repo
  CACHE_REPOSI:         ${{ secrets.CI_CACHE_REPOSITORY }}
  UPLOAD_CACHE:         ${{ github.workspace }}/${{ secrets.CI_UP_COMPILE_CACHE }}
  DWLOAD_CACHE:         ${{ github.workspace }}/${{ secrets.CI_DL_STORAGE_CACHE }}
  ## telegram bot
  TGRAM_API_ID:         ${{ secrets.NF_TELEGRAM_API_IDS }}
  TGRAM_APIHSH:         ${{ secrets.NF_TELEGRAM_API_HSH }}
  TGRAM_SESSID:         ${{ secrets.NF_TELEGRAM_SESSION }}
  TGRAM_NOTIFY:         ${{ github.workspace }}/${{ secrets.NF_TELEGRAM_PUSH_TO }}
  TGRAM_CHATID:         ${{ secrets.NF_TELEGRAM_CHAT_ID }}
  ## input status
  INPUT_CONFIG:         ${{ github.event.inputs.restore_config }}
  INPUT_WIFI5G:         ${{ github.event.inputs.boost_wifi_5g }}
  INPUT_UP_ART:         ${{ github.event.inputs.upload_firmware }}
  INPUT_UP_REL:         ${{ github.event.inputs.upload_release }}
  INPUT_UP_CLD:         ${{ github.event.inputs.upload_cloud }}
  INPUT_UP_WSS:         ${{ github.event.inputs.upload_wenshushu }}
  INPUT_NOTIFY:         ${{ github.event.inputs.telegram_notify }}


jobs:
  build:
    runs-on: ubuntu-26.04-arm

    permissions: write-all

    steps:
    - name: Start Timer (計測開始)
      run: |
        echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

    - name: Checkout Repo A (チェックアウト リポジトリ)
      uses: actions/checkout@main

    - name: Checkout Repo B (チェックアウト リポジトリ データ)
      uses: actions/checkout@main
      with:
        repository: ${{ env.PRIVATE_DATA }}
        token: ${{ env.GITHUB_TOKEN }}
        path: 'private_data'

    - name: Delete Old Workflows (古いワークフローの削除)
      uses: Mattraks/delete-workflow-runs@v2.1.0
      with:
        token: ${{ env.ACCESS_TOKEN }}
        repository: ${{ env.RUN_REF_REPO }}
        retain_days: 0
        keep_minimum_runs: 0
        delete_workflow_pattern: "raspberry-pi_3b imwrt 25.12-snapshot kernel 6.18"

    - name: Check Server Performance (サーバー性能の確認)
      id: check_env
      run: |
        find ${{ github.workspace }}/private_data -name "*.sh" -exec chmod +x {} +
        ${{ env.CHECK_SERVER }}

    - name: Sync and Wait for Plugin Repo (プラグインリポジトリの同期と待機)
      run: |
        ${{ env.PLUGINS_REPO }}

    - name: Initialization Environment  (環境の初期化)
      id: init
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        ${{ env.INIT_ENV_VAR }}

    - name: Free Disk Space (ディスク空き容量の確保)
      run: |
        ${{ env.EXPAND_SPACE }} >/dev/null 2>&1
        df -Th

    - name: Clone Source Code (ソースコードのクローン)
      working-directory: ./
      run: |
        df -hT /build
        git clone --depth 1 --single-branch $GIT_REPO_URL -b $GIT_HEAD_REF openwrt
        # Remove China Mirrors (中国ソースの削除)
        ${{ env.REMOV_CN_SRC }}
        # add feeds repo
        ${{ env.ADDING_FEEDS }}
        # get kernel version
        ${{ env.GET_KER_VERS }}
        # add new env
        echo "CACHE_TAG_ID=cache-${OUTPUT_FILES}-arm" >> $GITHUB_ENV

    - name: Restore ccache from Private Repo
      working-directory: ./openwrt
      env:
        GH_TOKEN: ${{ env.ACCESS_TOKEN }}
      run: |
        ${{ env.DWLOAD_CACHE }}

    - name: Update & Install Feeds (フィードの更新とインストール)
      working-directory: ./openwrt
      run: |
        # turboacc
        # curl -sSL https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh -o add_turboacc.sh && bash add_turboacc.sh
        # add hardware driver
        ${{ env.NEW_HW_SUPOT }}
        ./scripts/feeds update -a
        # packages lang update (rust and goland)
        ${{ env.UPDATE_LANGS }}
        ./scripts/feeds install -a
        # device patch
        ${{ env.PRIVATEPATCH }}/${{ env.TARGET_MODEL }}/${{ env.DEVICE_PATCH }}

    - name: Load Custom Configuration (カスタム設定の読み込み)
      working-directory: ./openwrt
      id: loadconfig
      run: |
        cp -rf ${{ env.PRIVATEPATCH }}/${{ env.TARGET_MODEL }}/${{ env.BUILD_CONFIG }} .config
        # immortalwrt patch
        ${{ env.PATCHIN_REPO }}
        # change argon style
        ${{ env.PRIVATEPATCH }}/${{ env.TARGET_MODEL }}/${{ env.ARGON_COLORS }}

    - name: Restore Config Archive (設定アーカイブの復元)
      if: steps.loadconfig.outcome == 'success' && env.INPUT_CONFIG == 'true'
      working-directory: ./openwrt
      run: |
        mv ${{ env.PRIVATEPATCH }}/${{ env.TARGET_MODEL }}/${{ env.BACKUP_FILES }} files
        echo "OUTPUT_FILES=$OUTPUT_FILES-configured" >> $GITHUB_ENV

    - name: Download Packages (パッケージのダウンロード)
      if: steps.loadconfig.outcome == 'success' && !cancelled()
      working-directory: ./openwrt
      id: package
      run: |
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware (ファームウェアのコンパイル)
      working-directory: ./openwrt
      id: compile
      env:
        export CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
        export CARGO_PROFILE_RELEASE_LTO: "true"
        export CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-cpu=cortex-a53 -C target-feature=+crypto,+crc,+neon"
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize Files (ファイルの整理)
      if: steps.compile.outcome == 'success'
      id: organize
      run: |
        cd ${{ github.workspace }}/openwrt/bin/targets/*/*
        ${{ env.FIRMWARE_ORG }}
        # generate release_body.txt
        cd ${{ github.workspace }}/openwrt
        ${{ env.UP_GHRELEASE }}

    - name: Upload to Artifacts (Artifactに保存)
      if: steps.organize.outcome == 'success' && env.INPUT_UP_ART == 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.OUTPUT_FILES }}
        path: ${{ env.FIRMWARE }}

    - name: Upload to Release (Releaseに公開)
      if: steps.compile.outcome == 'success' && env.INPUT_UP_REL == 'true'
      uses: softprops/action-gh-release@master
      with:
        token: ${{ env.ACCESS_TOKEN }}
        tag_name: ${{ env.TAG_NAME }}
        name: ${{ env.TARGET_CHIPS }}_${{ env.TARGET_MODEL }}_${{ env.TARGET_MEDIA }}_${{ env.LINUX_KERNEL }}_${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*
        body_path: ${{ github.workspace }}/openwrt/release_body.txt

    - name: Upload via Pyrogram
      if: steps.compile.outcome == 'success' && steps.organize.outcome == 'success' && env.INPUT_UP_CLD == 'true'
      working-directory: ./openwrt
      run: |
        ${{ env.UP_CLOUDSTOR }}

    - name: Upload to WenShuShu (ウェンおじさんにアップロードする)
      if: steps.compile.outcome == 'success' && steps.organize.outcome == 'success' && env.INPUT_UP_WSS == 'true'
      working-directory: ./openwrt
      run: |
        ${{ env.UP_WENSHUSHU }}

    - name: Calculate Duration (実行時間の計算)
      if: always() && env.INPUT_NOTIFY == 'true'
      run: |
        ${{ env.CALC_RUNTIME }} "${{ env.START_TIME }}"

    - name: Final Report & TG Notify (総合ステータス通知)
      if: always() && env.INPUT_NOTIFY == 'true'
      env:
        COMP_OUTCOME: ${{ steps.compile.outcome }}
      run: |
        ${{ env.TGRAM_NOTIFY }}

    - name: Archive and Upload CACHE (自動生成された究極のビルドキャッシュ)
      if: success() && !cancelled()
      working-directory: ./openwrt
      env:
        GH_TOKEN: ${{ env.ACCESS_TOKEN }}
      run: |
        ${{ env.UPLOAD_CACHE }} "${{ env.CACHE_TAG_ID }}" "${{ env.CACHE_REPOSI }}"

    - name: Delete Old Releases (古いリリースの削除)
      if: steps.compile.outcome == 'success' && env.INPUT_UP_REL == 'true'
      uses: ui86/delete-older-releases@v1
      with:
        keep_latest: 5
        delete_tags: true
        delete_tag_pattern: "${{ env.TARGET_MODEL }}_${{ env.GIT_HEAD_REF }}" 
